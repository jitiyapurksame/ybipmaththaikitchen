<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chinese Kitchen — Unit 1</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Bangers&display=swap');
  :root{
    --paper:#201410;
    --card:#32211a;
    --ink:#fbeee0;
    --ink-light:#c2a68a;
    --red:#e8482c;
    --red-dark:#c23b3b;
    --gold:#f4b400;
    --gold-dark:#d9a441;
    --green:#3E8E5C;
    --line:#5a3d26;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, #3a2412 0%, #201410 55%, #150d0a 100%);
    color:var(--ink);
    font-family:'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  #app{ max-width:640px; margin:0 auto; padding:18px 16px 60px; }
  h1,h2,h3{ margin:0 0 6px; }
  header.top{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  header.top .title{ font-family:'Bangers', cursive; font-size:24px; letter-spacing:1px; font-weight:400; color:var(--gold); }
  .back-btn{
    background:none; border:none; font-size:15px; color:var(--ink-light);
    cursor:pointer; padding:6px 4px 6px 0;
  }
  .back-btn:active{ color:var(--ink); }
  .subtitle{ color:var(--ink-light); font-size:13px; margin:-6px 0 16px; }

  .tile{
    background:var(--card); border:2px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:2px 2px 0 var(--line);
  }
  .tile .name{ font-weight:700; font-size:16px; }
  .tile .sub{ font-size:12.5px; color:var(--ink-light); margin-top:2px; }
  .tile .status{ font-size:12px; color:var(--green); font-weight:700; white-space:nowrap; }
  .tile .arrow{ font-size:18px; color:var(--ink-light); }
  .section-label{ font-size:13px; font-weight:800; color:var(--gold-dark); text-transform:uppercase; letter-spacing:0.5px; margin:20px 0 8px; }

  .card{
    background:var(--card); border:2px solid var(--ink); border-radius:var(--radius);
    padding:26px 20px; text-align:center; min-height:190px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    box-shadow:4px 4px 0 var(--gold);
  }
  .card .hanzi{ font-size:44px; font-weight:700; }
  .card .pinyin{ font-size:19px; color:var(--red-dark); font-weight:700; }
  .card .english{ font-size:17px; background:rgba(244,180,0,0.14); border:1px solid var(--line); border-radius:8px; padding:8px 14px; }
  .card .type{ font-size:11.5px; color:var(--ink-light); letter-spacing:0.5px; text-transform:uppercase; }
  .progress-line{ font-size:13px; color:var(--ink-light); margin-bottom:8px; }

  .btn{
    background:var(--red); color:#fff; border:none; border-radius:10px;
    padding:12px 18px; font-size:15px; font-weight:700; cursor:pointer;
    font-family:inherit;
  }
  .btn:active{ background:var(--red-dark); }
  .btn.secondary{ background:var(--card); color:var(--ink); border:2px solid var(--ink); }
  .btn:disabled{ opacity:.4; }
  .nav-row{ display:flex; gap:10px; margin-top:14px; justify-content:center; }

  .dialogue-line{
    background:var(--card); border:2px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px;
  }
  .dialogue-line .speaker{ font-size:12px; font-weight:800; color:var(--gold-dark); margin-bottom:4px; }
  .dialogue-line .hanzi{ font-size:20px; margin-bottom:4px; }
  .dialogue-line .pinyin{ font-size:14px; color:var(--red-dark); }
  .dialogue-line .english{ font-size:14px; color:var(--ink-light); margin-top:4px; }
  .dialogue-line.current{ border-color:var(--red); box-shadow:2px 2px 0 var(--gold); }
  .dialogue-line.dim{ opacity:.35; }

  .pattern-card{
    background:var(--card); border:2px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; cursor:pointer;
  }
  .pattern-card .head{ display:flex; justify-content:space-between; align-items:center; }
  .pattern-card .hanzi{ font-size:19px; font-weight:700; }
  .pattern-card .pinyin{ font-size:13px; color:var(--red-dark); }
  .pattern-card .meaning{ font-size:12.5px; color:var(--ink-light); }
  .pattern-card .examples{ margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; display:none; }
  .pattern-card.open .examples{ display:block; }
  .example-row{ margin-bottom:8px; }
  .example-row .hanzi{ font-size:16px; }
  .example-row .pinyin{ font-size:13px; color:var(--red-dark); }
  .example-row .english{ font-size:13px; color:var(--ink-light); }

  .match-grid{ display:flex; gap:14px; margin-top:14px; }
  .match-col{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .match-item{
    background:var(--card); border:2px solid var(--ink); border-radius:10px;
    padding:12px 10px; text-align:center; cursor:pointer; font-weight:700; font-size:14px;
  }
  .match-item.selected{ background:var(--gold); color:#2b1810; }
  .match-item.correct{ background:var(--green); color:#fff; border-color:var(--green); cursor:default; }
  .match-item.wrong{ background:var(--red); color:#fff; border-color:var(--red); }
  .match-item.done{ visibility:hidden; }
  .match-status{ text-align:center; font-size:14px; margin-top:14px; color:var(--ink-light); }

  .stroke-card{
    background:var(--card); border:2px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px;
  }
  .stroke-shape{ font-size:26px; width:44px; text-align:center; }
  .stroke-info{ flex:1; }
  .stroke-info .name{ font-weight:700; font-size:15px; }
  .stroke-info .name .en{ font-weight:400; color:var(--ink-light); font-size:13px; }
  .stroke-info .dir{ font-size:13px; color:var(--red-dark); margin:2px 0; }
  .stroke-info .examples{ font-size:20px; }
  .stroke-info .tip{ font-size:12px; color:var(--gold-dark); margin-top:4px; font-style:italic; }

  .empty-note{ color:var(--ink-light); font-size:14px; padding:10px 2px; }
</style>
</head>
<body>

/* ============ STATE / PERSISTENCE ============ */
const STORAGE_KEY = "chinese-kitchen-state";
function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveProgress(p){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch(e){}
}
let progress = loadProgress();
function lessonProgress(id){
  if(!progress[id]) progress[id] = {vocabDone:false, dialogueDone:false};
  return progress[id];
}
function markDone(id, field){
  const lp = lessonProgress(id);
  lp[field] = true;
  progress[id] = lp;
  saveProgress(progress);
}
function findLesson(id){ return LESSONS.find(l => l.id === id); }

/* ============ ROUTING ============ */
let route = {screen:"home"};
function nav(next){ route = next; render(); window.scrollTo(0,0); }

const app = document.getElementById('app');
function render(){
  app.innerHTML = "";
  if(route.screen==="home") return renderHome();
  if(route.screen==="lesson") return renderLessonHub(route.lessonId);
  if(route.screen==="vocab") return renderVocab(route.lessonId);
  if(route.screen==="dialogue") return renderDialogue(route.lessonId);
  if(route.screen==="patterns") return renderPatterns();
  if(route.screen==="match") return renderMatch();
  if(route.screen==="strokes") return renderStrokes();
}

function topBar(title, onBack){
  const header = document.createElement('header');
  header.className = "top";
  if(onBack){
    const b = document.createElement('button');
    b.className = "back-btn"; b.textContent = "\u2190 Back";
    b.onclick = onBack;
    header.appendChild(b);
  }
  const t = document.createElement('span');
  t.className = "title";
  t.textContent = title;
  header.appendChild(t);
  app.appendChild(header);
}

/* ---- VOCAB FLASHCARDS ---- */
function renderVocab(lessonId){
  const lesson = findLesson(lessonId);
  topBar("\u{1F9C2} Ingredient Cards", ()=>nav({screen:"lesson", lessonId}));

  let idx = 0;
  let revealed = false;
  const cards = lesson.vocab;

  function draw(){
    const old = document.getElementById('vWrap');
    if(old) old.remove();
    const wrap = document.createElement('div');
    wrap.id = "vWrap";
    const c = cards[idx];
    wrap.innerHTML = `
      <div class="progress-line">${idx+1} / ${cards.length}</div>
      <div class="card">
        ${c.type? `<div class="type">${c.type}</div>` : ``}
        <div class="hanzi">${c.hanzi}</div>
        <div class="pinyin">${c.pinyin}</div>
        ${revealed? `<div class="english">${c.english}</div>` : `<button class="btn" id="vReveal">\u{1F944} Taste it (reveal meaning)</button>`}
      </div>
      <div class="nav-row">
        <button class="btn secondary" id="vPrev" ${idx===0?'disabled':''}>\u2190 Prev</button>
        <button class="btn" id="vNext">${idx===cards.length-1? 'Finish' : 'Next \u2192'}</button>
      </div>
    `;
    app.appendChild(wrap);
    if(!revealed){
      document.getElementById('vReveal').onclick = ()=>{ revealed=true; draw(); };
    }
    document.getElementById('vPrev').onclick = ()=>{ if(idx>0){ idx--; revealed=false; draw(); } };
    document.getElementById('vNext').onclick = ()=>{
      if(idx < cards.length-1){ idx++; revealed=false; draw(); }
      else { markDone(lessonId, 'vocabDone'); nav({screen:"lesson", lessonId}); }
    };
  }
  draw();
}

/* ---- DIALOGUE PRACTICE ---- */
function renderDialogue(lessonId){
  const lesson = findLesson(lessonId);
  topBar("\u{1F35C} Follow the Recipe", ()=>nav({screen:"lesson", lessonId}));

  let idx = 0;
  let stage = 0; // 0 = hanzi only, 1 = + pinyin, 2 = + english
  const lines = lesson.dialogue;

  function draw(){
    const old = document.getElementById('dWrap');
    if(old) old.remove();
    const wrap = document.createElement('div');
    wrap.id = "dWrap";
    const p = document.createElement('div');
    p.className = "progress-line";
    p.textContent = `${idx+1} / ${lines.length}`;
    wrap.appendChild(p);

    lines.forEach((line, i)=>{
      const row = document.createElement('div');
      row.className = "dialogue-line" + (i===idx? " current" : " dim");
      let inner = `<div class="speaker">${line.speaker}</div><div class="hanzi">${line.hanzi}</div>`;
      if(i===idx){
        if(stage>=1) inner += `<div class="pinyin">${line.pinyin}</div>`;
        if(stage>=2) inner += `<div class="english">${line.english}</div>`;
      }
      row.innerHTML = inner;
      wrap.appendChild(row);
    });

    const navRow = document.createElement('div');
    navRow.className = "nav-row";
    if(stage < 2){
      const btn = document.createElement('button');
      btn.className = "btn";
      btn.textContent = stage===0? "Show pinyin" : "Show English";
      btn.onclick = ()=>{ stage++; draw(); };
      navRow.appendChild(btn);
    } else {
      const btn = document.createElement('button');
      btn.className = "btn";
      btn.textContent = idx===lines.length-1? "Finish" : "Next step \u2192";
      btn.onclick = ()=>{
        if(idx < lines.length-1){ idx++; stage=0; draw(); }
        else { markDone(lessonId, 'dialogueDone'); nav({screen:"lesson", lessonId}); }
      };
      navRow.appendChild(btn);
    }
    wrap.appendChild(navRow);
    app.appendChild(wrap);
  }
  draw();
}

/* ---- PINYIN MATCH GAME ---- */
function renderMatch(){
  topBar("\u{1F525} Flavor Pairing", ()=>nav({screen:"home"}));
  const sub = document.createElement('p');
  sub.className = "subtitle";
  sub.textContent = "Tap a pinyin ingredient, then match it to its English flavor";
  app.appendChild(sub);

  const pinyinOrder = MATCH_PAIRS.map((p,i)=>i).sort(()=>Math.random()-0.5);
  const englishOrder = MATCH_PAIRS.map((p,i)=>i).sort(()=>Math.random()-0.5);
  let selectedPinyin = null;
  let matchedCount = 0;

  const grid = document.createElement('div');
  grid.className = "match-grid";
  const colA = document.createElement('div');
  colA.className = "match-col";
  const colB = document.createElement('div');
  colB.className = "match-col";
  grid.appendChild(colA);
  grid.appendChild(colB);
  app.appendChild(grid);

  const status = document.createElement('div');
  status.className = "match-status";
  status.textContent = `Matched: 0 / ${MATCH_PAIRS.length}`;
  app.appendChild(status);

  pinyinOrder.forEach(i=>{
    const item = document.createElement('div');
    item.className = "match-item";
    item.textContent = MATCH_PAIRS[i].pinyin;
    item.dataset.index = i;
    item.onclick = ()=>{
      if(item.classList.contains('correct')) return;
      colA.querySelectorAll('.match-item').forEach(el=>el.classList.remove('selected'));
      item.classList.add('selected');
      selectedPinyin = i;
    };
    colA.appendChild(item);
  });

  englishOrder.forEach(i=>{
    const item = document.createElement('div');
    item.className = "match-item";
    item.textContent = MATCH_PAIRS[i].english;
    item.dataset.index = i;
    item.onclick = ()=>{
      if(item.classList.contains('correct') || selectedPinyin===null) return;
      const pinyinEl = colA.querySelector(`.match-item[data-index="${selectedPinyin}"]`);
      if(selectedPinyin === i){
        item.classList.remove('wrong');
        item.classList.add('correct');
        pinyinEl.classList.remove('selected');
        pinyinEl.classList.add('correct');
        selectedPinyin = null;
        matchedCount++;
        status.textContent = `Matched: ${matchedCount} / ${MATCH_PAIRS.length}`;
        if(matchedCount === MATCH_PAIRS.length){
          status.textContent = "\u{1F389} All matched! Nice work.";
        }
      } else {
        item.classList.add('wrong');
        setTimeout(()=>item.classList.remove('wrong'), 500);
      }
    };
    colB.appendChild(item);
  });
}
