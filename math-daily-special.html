<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Math Kitchen Ninja — Daily Special</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Bangers&display=swap');
  :root { --bg:#1b120d; --surface:#2b1d15; --surface2:#3a2818; --border:#5a3d26; --text:#fbeee0; --muted:#b9a488; --accent:#e8482c; --accent2:#ff8c3f; --gold:#f4b400; --gold2:#d68a00; --green:#7cb518; --red:#d7263d; --blue:#2a9d8f; --pink:#ff5fa8; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; user-select:none; }
  .screen { display:none; min-height:100vh; flex-direction:column; }
  .screen.active { display:flex; }
  #home { background: radial-gradient(ellipse at top, #3a2412 0%, #1b120d 60%); padding-bottom:30px; }
  .home-header { padding:24px 22px 6px; text-align:center; }
  .home-title { font-family:'Bangers',cursive; font-size:2.3rem; letter-spacing:2px; background:linear-gradient(135deg,#ff8c3f,#f4b400); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1.1; }
  .home-sub { font-size:.78rem; color:var(--muted); margin-top:4px; letter-spacing:1px; text-transform:uppercase; }
  .pill-row { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .pill { background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:5px 13px; font-size:.74rem; font-weight:800; color:var(--muted); text-decoration:none; }
  .pill b { color:var(--gold); }
  .card { margin:12px 20px 0; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px 18px; position:relative; }
  .card.big { border-color:var(--accent2); background:linear-gradient(135deg,#3a2412,#2b1d15); }
  .card.done { border-color:var(--green); }
  .card h2 { font-family:'Bangers',cursive; letter-spacing:1px; font-size:1.25rem; color:var(--gold); }
  .card p { font-size:.82rem; color:var(--muted); margin-top:4px; line-height:1.4; }
  .btn { display:block; width:100%; margin-top:12px; border:none; border-radius:14px; padding:14px; font-family:inherit; font-weight:900; font-size:.95rem; cursor:pointer; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  .btn:active { opacity:.85; }
  .btn.green { background:linear-gradient(135deg,var(--green),#059669); }
  .btn.ghost { background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
  .btn:disabled { opacity:.4; pointer-events:none; }
  .stamp { display:inline-block; transform:rotate(-6deg); border:3px solid var(--green); color:var(--green); border-radius:12px; padding:4px 12px; font-family:'Bangers',cursive; letter-spacing:2px; font-size:1.2rem; margin-top:8px; }
  .fridge-list { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .fridge-item { display:flex; align-items:center; gap:10px; background:var(--surface2); border-radius:12px; padding:8px 12px; font-size:.82rem; font-weight:700; }
  .fridge-item small { color:var(--muted); font-weight:600; margin-left:auto; text-align:right; }
  .back-link { display:block; text-align:center; margin:18px 0 0; color:var(--muted); font-size:.8rem; font-weight:700; text-decoration:underline; }
  .hdr { display:flex; align-items:center; gap:12px; padding:16px 18px 10px; border-bottom:1px solid var(--border); }
  .hdr-btn { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 14px; color:var(--text); font-family:inherit; font-size:.88rem; font-weight:700; cursor:pointer; }
  .hdr-title { flex:1; font-family:'Bangers',cursive; letter-spacing:1px; font-size:1.15rem; }
  .hdr-count { font-size:.78rem; color:var(--muted); font-weight:800; }
  .progress { height:8px; background:var(--border); margin:0 18px; border-radius:999px; overflow:hidden; margin-top:10px; }
  .progress > div { height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); border-radius:999px; transition:width .4s; }
  .qwrap { flex:1; padding:14px 18px 20px; display:flex; flex-direction:column; }
  .qcard { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px 18px; flex:1; display:flex; flex-direction:column; }
  .tag { align-self:flex-start; border-radius:999px; padding:4px 12px; font-size:.7rem; font-weight:800; letter-spacing:1px; text-transform:uppercase; margin-bottom:12px; background:var(--surface2); }
  .tag.fridge { color:var(--green); background:rgba(124,181,24,.14); }
  .tag.new { color:var(--accent2); }
  .tag.fix { color:var(--pink); background:rgba(255,95,168,.12); }
  .tag.box { color:var(--gold); background:rgba(244,180,0,.12); }
  .ins { font-size:.95rem; font-weight:700; line-height:1.4; margin-bottom:12px; }
  .vis { background:#fff8ec; border-radius:14px; padding:12px 10px 4px; margin-bottom:12px; }
  .prob { font-size:1.6rem; font-weight:900; font-family:'Courier New',monospace; text-align:center; background:var(--surface2); border-radius:14px; padding:18px 12px; margin-bottom:16px; line-height:1.4; }
  .row { display:flex; gap:10px; margin-bottom:12px; }
  .inp { flex:1; min-width:0; background:var(--surface2); border:2px solid var(--border); border-radius:14px; padding:14px; color:var(--text); font-family:'Courier New',monospace; font-size:1.25rem; font-weight:800; text-align:center; outline:none; }
  .inp:focus { border-color:var(--accent2); }
  .inp.correct { border-color:var(--green); background:rgba(124,181,24,.1); }
  .inp.wrong { border-color:var(--red); background:rgba(215,38,61,.1); }
  .chk { background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:14px; padding:0 22px; color:#fff; font-weight:900; cursor:pointer; font-family:inherit; }
  .fb { display:none; border-radius:14px; padding:12px 14px; margin-bottom:12px; font-size:.9rem; font-weight:700; gap:10px; align-items:center; }
  .fb.show { display:flex; }
  .fb.correct { background:rgba(124,181,24,.12); color:var(--green); border:1px solid rgba(124,181,24,.3); }
  .fb.wrong { background:rgba(215,38,61,.12); color:var(--red); border:1px solid rgba(215,38,61,.3); }
  .hint-btn { background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.3); border-radius:12px; padding:10px 14px; color:var(--gold); font-size:.85rem; font-weight:700; cursor:pointer; font-family:inherit; margin-bottom:10px; }
  .hint-panel { display:none; background:var(--surface2); border:1px solid rgba(251,191,36,.3); border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:.85rem; line-height:1.5; color:var(--gold); }
  .hint-panel.open { display:block; }
  .hint-panel svg { max-width:100%; }
  .hint-tier { margin-bottom:8px; }
  .hint-lab { font-size:.7rem; font-weight:800; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .nav { margin-top:auto; padding-top:8px; }
  .result { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; gap:10px; }
  .result .emoji { font-size:4rem; }
  .result h1 { font-family:'Bangers',cursive; font-size:2.1rem; letter-spacing:2px; color:var(--gold); }
  .result .big { font-size:1.1rem; color:var(--muted); }
  .result .big b { color:var(--gold); font-size:1.4rem; }
  .picker { margin:12px 20px 0; display:flex; flex-direction:column; gap:8px; }
  .pick-item { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; cursor:pointer; }
  .pick-item:active { transform:scale(.98); }
  .pick-num { width:38px; height:38px; border-radius:10px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-family:'Bangers',cursive; color:var(--accent2); }
  .pick-title { flex:1; font-weight:800; font-size:.9rem; }
  .pick-stars { font-size:.95rem; letter-spacing:1px; }
  .section-label { margin:18px 20px 0; font-size:.7rem; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
  .toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--gold); color:#1a1a00; font-family:'Bangers',cursive; font-size:1.7rem; letter-spacing:2px; padding:12px 26px; border-radius:16px; z-index:999; pointer-events:none; box-shadow:0 0 40px rgba(251,191,36,.6); display:none; }
  .toast.show { display:block; }
</style>
</head>
<body>

<div id="home" class="screen active"></div>

<div id="boxpick" class="screen">
  <div class="hdr"><button class="hdr-btn" onclick="goHome()">← Back</button><div class="hdr-title">🎁 Mystery Box</div></div>
  <div class="card" style="margin-top:14px"><p style="margin-top:0">Pick any <b>Cooked</b> dish. You get 5 fresh questions with brand-new numbers. 3 right = ⭐, 4 right = ⭐⭐, 5 right = ⭐⭐⭐. Stars never go away!</p></div>
  <div class="picker" id="boxlist"></div>
</div>

<div id="quiz" class="screen">
  <div class="hdr"><button class="hdr-btn" onclick="quitQuiz()">✕ Stop</button><div class="hdr-title" id="qtitle">Daily Special</div><div class="hdr-count" id="qcount">1 / 5</div></div>
  <div class="progress"><div id="qbar" style="width:0%"></div></div>
  <div class="qwrap" id="qwrap"></div>
</div>

<div id="done" class="screen"><div class="result" id="donebox"></div></div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════ VISUAL MODEL HELPERS (Singapore-method hints) ══════════════════════
// These build small inline SVGs/HTML used inside mission hints — number lines, fraction
// "pizzas", and ratio/percentage bar models. They never label the final answer digit;
// they only show the given numbers from the problem so the model is a thinking aid, not a giveaway.

function numberLineSVG(start, steps) {
  const end = start + steps;
  const lo = Math.min(start, end) - 3;
  const hi = Math.max(start, end) + 3;
  const w = 300, h = 78, pad = 18;
  const range = hi - lo;
  const scale = (w - pad * 2) / range;
  const x = v => pad + (v - lo) * scale;
  let ticks = '';
  for (let v = lo; v <= hi; v++) {
    const isStart = v === start;
    ticks += `<line x1="${x(v)}" y1="34" x2="${x(v)}" y2="${isStart ? 26 : 30}" stroke="#b9a488" stroke-width="${isStart ? 2 : 1}"/>`;
    ticks += `<text x="${x(v)}" y="50" font-size="10" fill="#b9a488" text-anchor="middle">${v}</text>`;
  }
  const x1 = x(start), x2 = x(Math.max(lo, Math.min(hi, end)));
  const mid = 'arr' + Math.floor(Math.random() * 1e6);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:300px;display:block;margin:8px auto">
    <defs><marker id="${mid}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2a9d8f"/></marker></defs>
    <line x1="${pad}" y1="34" x2="${w - pad}" y2="34" stroke="#5a3d26" stroke-width="2"/>
    ${ticks}
    <circle cx="${x1}" cy="34" r="4" fill="#f4b400"/>
    <path d="M ${x1} 20 Q ${(x1 + x2) / 2} 6 ${x2} 20" fill="none" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#${mid})"/>
    <text x="${(x1 + x2) / 2}" y="16" font-size="12" fill="#2a9d8f" text-anchor="middle" font-weight="700">${steps > 0 ? '+' : ''}${steps}</text>
  </svg>`;
}

function pizzaSVG(num, den) {
  const r = 40, cx = 50, cy = 50;
  let paths = '';
  for (let i = 0; i < den; i++) {
    const a0 = (i / den) * 2 * Math.PI - Math.PI / 2;
    const a1 = ((i + 1) / den) * 2 * Math.PI - Math.PI / 2;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const fill = i < num ? '#e8482c' : '#3a2818';
    paths += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${fill}" stroke="#1b120d" stroke-width="1.3"/>`;
  }
  return `<svg viewBox="0 0 100 100" style="width:96px;height:96px;display:block;margin:0 auto">${paths}</svg>`;
}

function fractionPizzaRow(fracs, joiner) {
  const items = fracs.map(([n, d]) => `<div style="text-align:center">${pizzaSVG(n, d)}<div style="font-size:0.72rem;color:#b9a488;margin-top:2px">${n}/${d}</div></div>`);
  let row = items[0];
  for (let i = 1; i < items.length; i++) {
    row += `<div style="align-self:center;font-size:1.2rem;color:#b9a488;font-weight:700;padding:0 2px">${joiner}</div>` + items[i];
  }
  return `<div style="display:flex;justify-content:center;align-items:flex-start;gap:2px;flex-wrap:wrap;margin:8px 0 4px">${row}</div>`;
}

function ratioBarSVG(parts) {
  const colors = ['#e8482c', '#2a9d8f', '#f4b400'];
  const total = parts.reduce((a, b) => a + b, 0);
  const w = 280, usable = w - 8, h = 40;
  let x = 4, segs = '';
  parts.forEach((p, i) => {
    const segW = usable * (p / total);
    segs += `<rect x="${x.toFixed(1)}" y="4" width="${(segW - 2).toFixed(1)}" height="30" fill="${colors[i % colors.length]}" stroke="#1b120d" stroke-width="1" rx="3"/>` +
      `<text x="${(x + segW / 2).toFixed(1)}" y="24" font-size="13" fill="#1b120d" text-anchor="middle" font-weight="700">${p}</text>`;
    x += segW;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:260px;display:block;margin:8px auto">${segs}</svg>`;
}

function percentBarSVG(pct) {
  const w = 280, h = 34, usable = w - 8;
  const segW = usable * (Math.min(pct, 100) / 100);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:260px;display:block;margin:8px auto">
    <rect x="4" y="4" width="${usable}" height="26" fill="#3a2818" stroke="#5a3d26" stroke-width="1.5" rx="4"/>
    <rect x="4" y="4" width="${segW.toFixed(1)}" height="26" fill="#f4b400" stroke="#d68a00" stroke-width="1.5" rx="4"/>
  </svg><div style="text-align:center;font-size:0.74rem;color:#b9a488;margin-top:-2px">${pct}% of the bar shaded (whole bar = 100%)</div>`;
}

function pieChartSVG(pct, label) {
  const size = 180, cx = size / 2, cy = size / 2, r = 78;
  const clamped = Math.max(0, Math.min(100, pct));
  const angle = clamped / 100 * 360;
  const rad = deg => (deg - 90) * Math.PI / 180;
  const x1 = cx + r * Math.cos(rad(0));
  const y1 = cy + r * Math.sin(rad(0));
  const x2 = cx + r * Math.cos(rad(angle));
  const y2 = cy + r * Math.sin(rad(angle));
  const largeArc = angle > 180 ? 1 : 0;
  let slice = '';
  if (clamped >= 99.95) {
    slice = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#f4b400" stroke="#d68a00" stroke-width="2"/>`;
  } else if (clamped > 0.05) {
    slice = `<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="#f4b400" stroke="#d68a00" stroke-width="2"/>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:150px;display:block;margin:8px auto">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#3a2818" stroke="#5a3d26" stroke-width="2"/>
    ${slice}
  </svg><div style="text-align:center;font-size:0.74rem;color:#b9a488;margin-top:-2px">${label || (clamped + '% of the circle shaded')}</div>`;
}

// ══════════════════════ ANGLE & SHAPE DIAGRAMS ══════════════════════
const GOLD = '#f4b400', GOLDLINE = '#d68a00', RED = '#e8482c', TEAL = '#2a9d8f', BG = '#3a2818', LINE = '#5a3d26', LABEL = '#f4d9a0', MUTED = '#b9a488';

function svgWrap(inner, vbW, vbH, caption, maxWidth) {
  return `<svg viewBox="0 0 ${vbW} ${vbH}" style="width:100%;max-width:${maxWidth || 220}px;display:block;margin:8px auto">${inner}</svg>${caption ? `<div style="text-align:center;font-size:0.72rem;color:${MUTED};margin-top:-2px">${caption}</div>` : ''}`;
}

function triangleAngleSVG(a, b, c, caption) {
  const p1 = [20, 175], p2 = [200, 175], p3 = [95, 20];
  const inner = `
    <polygon points="${p1.join(',')} ${p2.join(',')} ${p3.join(',')}" fill="${BG}" stroke="${GOLD}" stroke-width="3"/>
    <text x="42" y="165" font-size="17" fill="${LABEL}" font-weight="bold">${a}</text>
    <text x="160" y="165" font-size="17" fill="${LABEL}" font-weight="bold" text-anchor="end">${b}</text>
    <text x="95" y="45" font-size="17" fill="${RED}" font-weight="bold" text-anchor="middle">${c}</text>`;
  return svgWrap(inner, 220, 195, caption || 'Angles inside any triangle always add to 180°');
}

function triangleSidesSVG(s1, s2, s3, caption) {
  const p1 = [20, 175], p2 = [200, 175], p3 = [95, 20];
  const inner = `
    <polygon points="${p1.join(',')} ${p2.join(',')} ${p3.join(',')}" fill="${BG}" stroke="${GOLD}" stroke-width="3"/>
    <text x="110" y="192" font-size="16" fill="${LABEL}" font-weight="bold" text-anchor="middle">${s1}</text>
    <text x="45" y="90" font-size="16" fill="${LABEL}" font-weight="bold" text-anchor="middle" transform="rotate(-56 45 90)">${s2}</text>
    <text x="160" y="90" font-size="16" fill="${LABEL}" font-weight="bold" text-anchor="middle" transform="rotate(56 160 90)">${s3}</text>`;
  return svgWrap(inner, 220, 200, caption || 'Perimeter = add up all three sides');
}

function polygonAngleSVG(n, angleLabel, caption) {
  const cx = 100, cy = 100, r = 72;
  const rotation = n === 4 ? 45 : (n === 6 ? 0 : -90);
  const pts = [];
  for (let i = 0; i < n; i++) {
    const ang = (rotation + i * 360 / n) * Math.PI / 180;
    pts.push([(cx + r * Math.cos(ang)).toFixed(1), (cy + r * Math.sin(ang)).toFixed(1)]);
  }
  const poly = pts.map(p => p.join(',')).join(' ');
  // label near the first vertex
  const lx = (parseFloat(pts[0][0]) * 0.8 + cx * 0.2).toFixed(1);
  const ly = (parseFloat(pts[0][1]) * 0.8 + cy * 0.2).toFixed(1);
  const inner = `
    <polygon points="${poly}" fill="${BG}" stroke="${GOLD}" stroke-width="3"/>
    <circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="4" fill="${RED}"/>
    <text x="${lx}" y="${ly}" font-size="16" fill="${RED}" font-weight="bold" text-anchor="middle">${angleLabel}</text>`;
  return svgWrap(inner, 200, 200, caption);
}

function circleAngleSVG(label, caption) {
  const cx = 100, cy = 100, r = 70;
  const inner = `
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${GOLD}" stroke-width="3"/>
    <circle cx="${cx}" cy="${cy - r}" r="4" fill="${RED}"/>
    <path d="M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 1} ${cy - r}" fill="none" stroke="${RED}" stroke-width="2.5" stroke-dasharray="6,5"/>
    <text x="${cx}" y="${cy + 6}" font-size="20" fill="${LABEL}" font-weight="bold" text-anchor="middle">${label}</text>`;
  return svgWrap(inner, 200, 200, caption || 'One full turn, all the way around');
}

function straightLineAngleSVG(known, unknownLabel, caption) {
  const cx = 100, cy = 130;
  const inner = `
    <line x1="10" y1="${cy}" x2="190" y2="${cy}" stroke="${GOLD}" stroke-width="3"/>
    <line x1="${cx}" y1="${cy}" x2="${cx - 55}" y2="30" stroke="${GOLD}" stroke-width="3"/>
    <text x="45" y="115" font-size="16" fill="${LABEL}" font-weight="bold">${known}</text>
    <text x="135" y="115" font-size="16" fill="${RED}" font-weight="bold">${unknownLabel}</text>`;
  return svgWrap(inner, 200, 150, caption || 'Angles on a straight line always add to 180°');
}

function anglesAroundPointSVG(segments, caption) {
  // segments: [{deg, label, color}], degrees should sum to 360
  const cx = 100, cy = 100, r = 78;
  let acc = -90;
  const parts = segments.map(seg => {
    const start = acc, end = acc + seg.deg;
    acc = end;
    const rad = d => (d * Math.PI) / 180;
    const x1 = cx + r * Math.cos(rad(start)), y1 = cy + r * Math.sin(rad(start));
    const x2 = cx + r * Math.cos(rad(end)), y2 = cy + r * Math.sin(rad(end));
    const large = seg.deg > 180 ? 1 : 0;
    const midAng = rad(start + seg.deg / 2);
    const lx = cx + (r * 0.6) * Math.cos(midAng), ly = cy + (r * 0.6) * Math.sin(midAng);
    const dash = seg.dashed ? 'stroke-dasharray="5,4"' : '';
    return `<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${seg.color}" fill-opacity="0.55" stroke="${seg.color}" stroke-width="2" ${dash}/>
      <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="15" fill="${LABEL}" font-weight="bold" text-anchor="middle">${seg.label}</text>`;
  }).join('');
  return svgWrap(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${BG}" stroke="${LINE}" stroke-width="1"/>${parts}`, 200, 200, caption || 'All the angles around a point add to 360°');
}

function verticalAnglesSVG(aLabel, bLabel, caption) {
  const cx = 100, cy = 100;
  const inner = `
    <line x1="20" y1="40" x2="180" y2="160" stroke="${GOLD}" stroke-width="3"/>

  return svgWrap(inner, 200, 200, caption || 'Vertically opposite angles (across the X) are always equal');
}

function parallelAnglesSVG(type, known, targetLabel, caption) {
  const y1 = 55, y2 = 145;
  const tx1 = 40, ty1 = 15, tx2 = 160, ty2 = 185; // transversal endpoints (slopes down-right)
  const slope = (tx2 - tx1) / (ty2 - ty1); // dx per dy
  const ix1 = tx1 + slope * (y1 - ty1); // where transversal crosses line 1
  const ix2 = tx1 + slope * (y2 - ty1); // where transversal crosses line 2

  // "known" is always placed as the interior angle at line 1: right of the transversal, below the line
  const knownX = ix1 + 26, knownY = y1 + 28;

  // where the target ("?") goes depends on how it relates to "known"
  let targetX, targetY, anchor = 'start';
  if (type === 'corresponding') {
    // same corner (right side, below-the-line position) repeated at line 2 → sits below line 2
    targetX = ix2 + 26; targetY = y2 + 28;
  } else if (type === 'alternate') {
    // interior angle, opposite side of the transversal → left of transversal, above line 2
    targetX = ix2 - 26; targetY = y2 - 14; anchor = 'end';
  } else { // co-interior
    // interior angle, same side of the transversal → right of transversal, above line 2
    targetX = ix2 + 18; targetY = y2 - 14;
  }

  const inner = `
    <line x1="15" y1="${y1}" x2="185" y2="${y1}" stroke="${GOLD}" stroke-width="3"/>
    <line x1="15" y1="${y2}" x2="185" y2="${y2}" stroke="${GOLD}" stroke-width="3"/>
    <line x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="${TEAL}" stroke-width="3"/>
    <text x="10" y="30" font-size="13" fill="${MUTED}">line 1</text>
    <text x="10" y="205" font-size="13" fill="${MUTED}">line 2</text>
    <text x="${knownX.toFixed(1)}" y="${knownY.toFixed(1)}" font-size="15" fill="${LABEL}" font-weight="bold">${known}</text>
    <text x="${targetX.toFixed(1)}" y="${targetY.toFixed(1)}" font-size="15" fill="${RED}" font-weight="bold" text-anchor="${anchor}">${targetLabel}</text>`;
  const captions = {
    corresponding: 'Corresponding angles (F-angles) sit in the same corner at each line — equal',
    alternate: 'Alternate angles (Z-angles) sit on opposite sides of the middle line — equal',
    'co-interior': 'Co-interior angles sit between the lines, same side — add to 180°'
  };
  return svgWrap(inner, 200, 220, caption || captions[type]);
}

function sequenceBarsSVG(terms, opLabels, caption) {
  // terms: array of numbers/strings to show as bars ('?' allowed for an unknown bar, drawn short & dashed)
  // opLabels: array (length terms.length-1) of strings shown between each pair of bars, e.g. '+4' or '×3' or '?'
  const numericTerms = terms.map(t => (typeof t === 'number' ? t : null)).filter(v => v !== null);
  const maxVal = Math.max(...numericTerms, 1);
  const chartH = 110, barW = 30, gap = 16, x0 = 15, baseY = 140;
  let bars = '', arrows = '';
  terms.forEach((t, i) => {
    const isUnknown = (t === '?' || t === null);
    const val = isUnknown ? maxVal * 0.4 : t;
    const h = Math.max(8, (val / maxVal) * chartH);
    const x = x0 + i * (barW + gap);
    const y = baseY - h;
    const dash = isUnknown ? 'stroke-dasharray="4,3"' : '';
    const fill = isUnknown ? 'none' : GOLD;
    bars += `<rect x="${x}" y="${y.toFixed(1)}" width="${barW}" height="${h.toFixed(1)}" fill="${fill}" stroke="${isUnknown ? RED : GOLDLINE}" stroke-width="2" ${dash} rx="2"/>
      <text x="${x + barW / 2}" y="${(y - 7).toFixed(1)}" font-size="13" fill="${isUnknown ? RED : LABEL}" font-weight="bold" text-anchor="middle">${t}</text>`;
    if (i < terms.length - 1 && opLabels && opLabels[i]) {
      const midX = x + barW + gap / 2;
      arrows += `<text x="${midX.toFixed(1)}" y="${baseY + 18}" font-size="12" fill="${TEAL}" font-weight="bold" text-anchor="middle">${opLabels[i]}</text>`;
    }
  });
  const vbW = x0 * 2 + terms.length * (barW + gap);
  return svgWrap(`${bars}${arrows}<line x1="5" y1="${baseY}" x2="${vbW - 5}" y2="${baseY}" stroke="${LINE}" stroke-width="1.5"/>`, vbW, baseY + 35, caption, 280);
}

// ── Transformations: a real x/y grid with the point plotted (and a mirror line for reflections) ──
function coordinateGraphSVG(points, mirrorAxis, caption) {
  const range = [-6, 6];
  const size = 210;
  const scale = size / (range[1] - range[0]);
  const toPx = v => (v - range[0]) * scale;
  const cx = toPx(0), cy = size - toPx(0);
  let grid = '';
  for (let g = range[0]; g <= range[1]; g++) {
    const gx = toPx(g), gy = size - toPx(g);
    grid += `<line x1="${gx}" y1="0" x2="${gx}" y2="${size}" stroke="${LINE}" stroke-width="0.5"/>
      <line x1="0" y1="${gy}" x2="${size}" y2="${gy}" stroke="${LINE}" stroke-width="0.5"/>`;
  }
  const axes = `<line x1="0" y1="${cy}" x2="${size}" y2="${cy}" stroke="${GOLDLINE}" stroke-width="2"/>
    <line x1="${cx}" y1="0" x2="${cx}" y2="${size}" stroke="${GOLDLINE}" stroke-width="2"/>`;
  let mirror = '';
  if (mirrorAxis === 'x') mirror = `<line x1="0" y1="${cy}" x2="${size}" y2="${cy}" stroke="${RED}" stroke-width="3" stroke-dasharray="6,4"/>`;
  if (mirrorAxis === 'y') mirror = `<line x1="${cx}" y1="0" x2="${cx}" y2="${size}" stroke="${RED}" stroke-width="3" stroke-dasharray="6,4"/>`;
  const dots = points.map(p => {
    const px = toPx(p.x), py = size - toPx(p.y);
    return `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="5" fill="${p.color || GOLD}" stroke="${BG}" stroke-width="1.5"/>
      <text x="${(px + 8).toFixed(1)}" y="${(py - 8).toFixed(1)}" font-size="13" fill="${p.color || GOLD}" font-weight="bold">${p.label || ''}</text>`;
  }).join('');
  return svgWrap(`<rect x="0" y="0" width="${size}" height="${size}" fill="${BG}"/>${grid}${axes}${mirror}${dots}`, size, size, caption, 230);
}

// ── Transformations: original point plus a directional vector arrow (translation) ──
function translationVectorSVG(x, y, dx, dy, caption) {
  const range = [-6, 6];
  const size = 210;
  const scale = size / (range[1] - range[0]);
  const toPx = v => (v - range[0]) * scale;
  const cx = toPx(0), cy = size - toPx(0);
  let grid = '';
  for (let g = range[0]; g <= range[1]; g++) {
    const gx = toPx(g), gy = size - toPx(g);
    grid += `<line x1="${gx}" y1="0" x2="${gx}" y2="${size}" stroke="${LINE}" stroke-width="0.5"/>
      <line x1="0" y1="${gy}" x2="${size}" y2="${gy}" stroke="${LINE}" stroke-width="0.5"/>`;
  }
  const axes = `<line x1="0" y1="${cy}" x2="${size}" y2="${cy}" stroke="${GOLDLINE}" stroke-width="2"/>
    <line x1="${cx}" y1="0" x2="${cx}" y2="${size}" stroke="${GOLDLINE}" stroke-width="2"/>`;
  const px = toPx(x), py = size - toPx(y);
  const arrowLen = 42;
  const angle = Math.atan2(-dy, dx);
  const ax = px + arrowLen * Math.cos(angle), ay = py + arrowLen * Math.sin(angle);
  const arrow = `<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${ax.toFixed(1)}" y2="${ay.toFixed(1)}" stroke="${RED}" stroke-width="3" marker-end="url(#tarrow)"/>
    <defs><marker id="tarrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="${RED}"/></marker></defs>
    <text x="${(ax + 6).toFixed(1)}" y="${ay.toFixed(1)}" font-size="13" fill="${RED}" font-weight="bold">(${dx >= 0 ? '+' : ''}${dx}, ${dy >= 0 ? '+' : ''}${dy})</text>`;
  const dot = `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="5" fill="${GOLD}" stroke="${BG}" stroke-width="1.5"/>
    <text x="${(px + 8).toFixed(1)}" y="${(py - 8).toFixed(1)}" font-size="13" fill="${GOLD}" font-weight="bold">(${x},${y})</text>`;
  return svgWrap(`<rect x="0" y="0" width="${size}" height="${size}" fill="${BG}"/>${grid}${axes}${dot}${arrow}`, size, size, caption, 230);
}

function speedLineSVG(distance, time, speed, unit, caption) {
  unit = unit || 'km';
  const x0 = 20, x1 = 190, y = 95;
  let segCount = null, segLabel = null, totalLabel, timeLabel;

  function segmentsFor(t) {
    // Returns { count, unitHours } splitting t hours into whole or half-hour chunks
    if (Number.isInteger(t)) return { count: t, unitHours: 1 };
    const half = t / 0.5;
    if (Number.isInteger(half)) return { count: half, unitHours: 0.5 };
    return null;
  }

  if (distance !== null && time !== null) {
    // Both given — split the known distance into `time` equal per-hour chunks
    const s = segmentsFor(time);
    if (s && s.count >= 1 && s.count <= 8) {
      segCount = s.count;
      segLabel = `${+(distance / s.count).toFixed(2)} ${unit}`;
    }
    totalLabel = `${distance} ${unit}`;
    timeLabel = `${time} h`;
  } else if (distance === null && speed !== null && time !== null) {
    // Distance unknown — each chunk is the KNOWN speed, total stays "?"
    const s = segmentsFor(time);
    if (s && s.count >= 1 && s.count <= 8) {
      segCount = s.count;
      segLabel = `${+(speed * s.unitHours).toFixed(2)} ${unit}`;
    }
    totalLabel = `? ${unit}`;
    timeLabel = `${time} h`;
  } else if (time === null && distance !== null && speed !== null) {
    // Time unknown — chop the known distance into KNOWN-speed-sized chunks
    const count = distance / speed;
    if (Number.isInteger(count) && count >= 1 && count <= 8) {
      segCount = count;
      segLabel = `${speed} ${unit}`;
    }
    totalLabel = `${distance} ${unit}`;
    timeLabel = '? h';
  } else {
    totalLabel = distance !== null ? `${distance} ${unit}` : `? ${unit}`;
    timeLabel = (time !== null ? `${time} h` : '? h') + (speed !== null ? ` · speed ${speed} ${unit}/h` : '');
  }

  let segMarks = '';
  if (segCount) {
    const segW = (x1 - x0) / segCount;
    for (let i = 1; i < segCount; i++) {
      const tx = x0 + i * segW;
      segMarks += `<line x1="${tx.toFixed(1)}" y1="${y - 6}" x2="${tx.toFixed(1)}" y2="${y + 6}" stroke="${MUTED}" stroke-width="1.5"/>`;
    }
    if (segLabel) {
      for (let i = 0; i < segCount; i++) {
        const mx = x0 + (i + 0.5) * segW;
        segMarks += `<text x="${mx.toFixed(1)}" y="${y + 20}" font-size="10" fill="${TEAL}" font-weight="bold" text-anchor="middle">${segLabel}</text>`;
      }
    }
  }

  // Car sits at the start, mirrored so it faces the direction of travel (toward the red end dot)
  const inner = `
    <line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${GOLD}" stroke-width="3"/>
    ${segMarks}
    <circle cx="${x0}" cy="${y}" r="4" fill="${TEAL}"/>
    <circle cx="${x1}" cy="${y}" r="4" fill="${RED}"/>
    <g transform="translate(${x0},0) scale(-1,1) translate(${-x0},0)">
      <text x="${x0}" y="${y - 45}" font-size="28" text-anchor="middle">🚗</text>
    </g>
    <line x1="${x0 + 12}" y1="${y - 8}" x2="${x1 - 16}" y2="${y - 8}" stroke="${TEAL}" stroke-width="2" marker-end="url(#carrow)"/>
    <defs><marker id="carrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="${TEAL}"/></marker></defs>
    <text x="${(x0 + x1) / 2}" y="${y - 16}" font-size="14" fill="${LABEL}" font-weight="bold" text-anchor="middle">${totalLabel}</text>
    <text x="${(x0 + x1) / 2}" y="${y + (segCount ? 38 : 24)}" font-size="13" fill="${MUTED}" text-anchor="middle">⏱️ ${timeLabel}</text>`;
  return svgWrap(inner, 210, 150, caption, 230);
}

// ── Probability: a "total = 1" bar split into P(A), P(B), and "neither" ──
function probabilitySumBarSVG(pA, pB, labelA, labelB, caption) {
  const w = 280, usable = w - 8, h = 40;
  const rest = Math.max(0, 1 - pA - pB);
  const segs = [
    { v: pA, color: RED, label: labelA || `P(A)=${pA}` },
    { v: pB, color: TEAL, label: labelB || `P(B)=${pB}` },
    { v: rest, color: LINE, label: rest > 0.02 ? 'neither' : '' }

  let x = 4, out = '';
  segs.forEach(s => {
    const segW = usable * s.v;
    if (segW > 1) {
      out += `<rect x="${x.toFixed(1)}" y="4" width="${(segW - 2).toFixed(1)}" height="30" fill="${s.color}" stroke="${BG}" stroke-width="1" rx="3"/>`;

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:260px;display:block;margin:8px auto">${out}</svg><div style="text-align:center;font-size:0.72rem;color:${MUTED};margin-top:-2px">${caption || 'Mutually exclusive events never overlap — just add the two chunks'}</div>`;
}

// ── Multi-step money chain: box → arrow (with op label) → box → arrow → box ──
function priceChainSVG(steps, caption) {
  // steps: [{ label, value }, ...] — draws value boxes with the operation written on the arrow between them
  const boxW = 74, boxH = 46, gap = 46, y0 = 20;
  let out = '', x = 10;
  steps.forEach((s, i) => {
    out += `<rect x="${x}" y="${y0}" width="${boxW}" height="${boxH}" fill="${BG}" stroke="${i === steps.length - 1 ? RED : GOLD}" stroke-width="2.5" rx="8"/>

      <text x="${x + boxW / 2}" y="${y0 + boxH + 16}" font-size="10" fill="${MUTED}" text-anchor="middle">${s.label}</text>`;
    if (i < steps.length - 1) {
      const ax = x + boxW, ax2 = ax + gap;
      out += `<line x1="${ax}" y1="${y0 + boxH / 2}" x2="${ax2}" y2="${y0 + boxH / 2}" stroke="${TEAL}" stroke-width="2.5" marker-end="url(#pchain${i})"/>

    x += boxW + gap;
  });
  return `<svg viewBox="0 0 ${x} 100" style="width:100%;max-width:320px;display:block;margin:8px auto">${out}</svg>${caption ? `<div style="text-align:center;font-size:0.72rem;color:${MUTED};margin-top:-2px">${caption}</div>` : ''}`;
}

// ══════════════════════ MINI CHART GENERATORS ══════════════════════
// Small inline SVGs for the Graphs level, so "reading a graph" questions
// actually show a graph instead of just describing one in words.

function svgBarChart(data) {
  const width = 280, height = 160, padding = 30, barGap = 18;
  const maxVal = Math.max(...data.map(d => d[1])) * 1.2;
  const barWidth = (width - padding * 2 - barGap * (data.length - 1)) / data.length;
  const colors = ['#e8482c', '#f4b400', '#7cb518', '#2a9d8f', '#ff8c3f'];
  let bars = '';
  data.forEach((d, i) => {
    const barHeight = (d[1] / maxVal) * (height - padding * 2);
    const x = padding + i * (barWidth + barGap);
    const y = height - padding - barHeight;
    bars += `<rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" rx="6" fill="${colors[i % colors.length]}" />
      <text x="${x + barWidth / 2}" y="${y - 8}" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a2818">${d[1]}</text>
      <text x="${x + barWidth / 2}" y="${height - padding + 18}" text-anchor="middle" font-size="13" fill="#3a2818">${d[0]}</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;max-width:300px;height:auto;display:block;margin:0 auto">
    <line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="#3a2818" stroke-width="2" />
    ${bars}
  </svg>`;
}

function svgLineChart(data, color) {
  color = color || '#e8482c';
  const width = 280, height = 160, padding = 30;
  const values = data.map(d => d[1]);
  const minVal = Math.min(...values) * 0.9;
  const maxVal = Math.max(...values) * 1.1;
  const stepX = (width - padding * 2) / (data.length - 1);
  const points = data.map((d, i) => ({
    x: padding + i * stepX,
    y: height - padding - ((d[1] - minVal) / (maxVal - minVal)) * (height - padding * 2),
    label: d[0], val: d[1]
  }));
  const pathD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ' ' + p.y).join(' ');
  const dots = points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="5" fill="${color}" />
      <text x="${p.x}" y="${p.y - 12}" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a2818">${p.val}</text>
      <text x="${p.x}" y="${height - padding + 18}" text-anchor="middle" font-size="13" fill="#3a2818">${p.label}</text>`).join('');
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;max-width:300px;height:auto;display:block;margin:0 auto">
    <line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="#3a2818" stroke-width="2" />
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="3" />
    ${dots}
  </svg>`;
}

function svgCoordGrid(opts) {
  opts = opts || {};
  const size = 260, half = size / 2, range = opts.range || 6;
  const scale = half / range;
  const toX = x => half + x * scale;
  const toY = y => half - y * scale;
  let gridLines = '';
  for (let i = -range; i <= range; i++) {
    if (i === 0) continue;
    gridLines += `<line x1="${toX(i)}" y1="0" x2="${toX(i)}" y2="${size}" stroke="#e6dac8" stroke-width="1"/>
      <line x1="0" y1="${toY(i)}" x2="${size}" y2="${toY(i)}" stroke="#e6dac8" stroke-width="1"/>`;
  }
  let line = '';
  if (opts.line) {
    const l = opts.line;
    line = `<line x1="${toX(l.x1)}" y1="${toY(l.y1)}" x2="${toX(l.x2)}" y2="${toY(l.y2)}" stroke="${l.color || '#e8482c'}" stroke-width="3"/>`;
  }
  const points = (opts.points || []).map(p => `<circle cx="${toX(p.x)}" cy="${toY(p.y)}" r="6" fill="${p.color || '#e8482c'}" stroke="#3a2818" stroke-width="1.5"/>
      <text x="${toX(p.x) + 10}" y="${toY(p.y) - 8}" font-size="13" font-weight="bold" fill="#3a2818">(${p.x}, ${p.y})</text>`).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:240px;height:auto;display:block;margin:0 auto">
    ${gridLines}
    <line x1="0" y1="${half}" x2="${size}" y2="${half}" stroke="#3a2818" stroke-width="2"/>
    <line x1="${half}" y1="0" x2="${half}" y2="${size}" stroke="#3a2818" stroke-width="2"/>
    ${line}
    ${points}
  </svg>`;
}


// ══════════════════════ SEASON 2 · PART A — NUMBER KITCHEN II (Levels 101–110) ══════════════════════
// Every mission is a tiny generator, so numbers are FRESH each time the page loads.
// code = Cambridge IGCSE 0580 syllabus code; P(tag, mission) = "Prep Station" (an old Season 1 skill used inside the new dish).
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a, pick = a => a[rnd(0, a.length - 1)];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const gcd = (a, b) => b ? gcd(b, a % b) : a, lcm = (a, b) => a / gcd(a, b) * b;
const pf = n => { const r = []; for (let p = 2; n > 1; p++) while (n % p === 0) { r.push(p); n /= p; } return r; };
const n2 = x => Number(x.toFixed(4)), pad4 = n => String(n).padStart(4, '0');
const toMin = t => Math.floor(t / 100) * 60 + t % 100, toHM = m => pad4(Math.floor(m / 60) * 100 + m % 60);
const r1 = x => { const s = Math.pow(10, Math.floor(Math.log10(x))); return n2(Math.round(x / s) * s); };
const H = (setup, formula, visual) => { const h = {}; if (visual) h.visual = visual; if (setup) h.setup = setup; if (formula) h.formula = formula; return h; };
const Q = (ins, prob, ans, hint, extra) => Object.assign({ type: 'calc', instruction: ins, problem: prob, answer: String(ans), hint }, extra || {});
const P = (tag, m) => Object.assign(m, { prep: tag });
const S = (action, detail, check) => ({ action, detail, check: check === undefined ? undefined : String(check) });
const BOSS = (ins, prob, steps, hint) => ({ type: 'boss', instruction: '🔪 CHEF CHALLENGE: ' + ins, problem: prob, answer: steps.filter(s => s.check).map(s => s.check).join(','), hint, solution: steps });
const bar = (segs, cap) => {
  const cols = ['#e8482c', '#2a9d8f', '#f4b400', '#ff8c3f']; const tot = segs.reduce((a, s) => a + s[0], 0); let x = 4, o = '';
  segs.forEach((s, i) => { const w = 272 * s[0] / tot; o += `<rect x="${x.toFixed(1)}" y="6" width="${(w - 2).toFixed(1)}" height="30" rx="3" fill="${cols[i % 4]}" stroke="#1b120d"/><text x="${(x + w / 2).toFixed(1)}" y="26" font-size="12" font-weight="700" fill="#1b120d" text-anchor="middle">${s[1]}</text>`; x += w; });
  return svgWrap(o, 280, 42, cap, 280);
};
const LV = (title, emoji, color, code, gens) => ({ title, emoji, color, code, gens, missions: gens.map(g => Object.assign(g(), { code })) });

const PR = [[12, 18], [8, 20], [24, 36], [15, 25], [14, 21], [16, 24], [18, 30], [20, 30], [28, 42], [36, 48], [45, 60], [9, 15], [10, 25]];
const RP = [[1, 2], [2, 3], [1, 3], [3, 5], [2, 5], [3, 4], [4, 5], [5, 6]];
const hcfQ = () => { const [a, b] = pick(PR); return Q(`Find the <strong>HCF</strong> (highest common factor) of ${a} and ${b}`, `HCF(${a}, ${b}) = ?`, gcd(a, b), H('List the factors of each. Which are in BOTH lists? Take the biggest.', `${a} = ${pf(a).join('×')} and ${b} = ${pf(b).join('×')}. Multiply the primes they SHARE → ${gcd(a, b)}`)); };
const lcmQ = () => { const [a, b] = pick(PR); return Q(`Find the <strong>LCM</strong> (lowest common multiple) of ${a} and ${b}`, `LCM(${a}, ${b}) = ?`, lcm(a, b), H(`Write the multiples of ${b}: ${b}, ${2 * b}, ${3 * b}… Stop at the first one that ${a} divides into.`, `LCM = ${a} × ${b} ÷ HCF = ${a * b} ÷ ${gcd(a, b)} = ${lcm(a, b)}`)); };
const LEVELS_A = {
  101: LV('Ingredient Breakdown: Primes & Factors', '🧅', 1, 'E1.1', [
    () => { const p = pick([11, 13, 17, 19, 23, 29, 31, 37]); const c = shuffle([21, 27, 33, 39, 49, 51, 57, 91, 87, 77]).slice(0, 3); return Q('🧅 Only ONE of these is a <strong>prime</strong> (exactly two factors: 1 and itself). Which one?', shuffle([p, ...c]).join(',  '), p, H('Try dividing each number by 3 and 7. If it splits evenly, it is NOT prime.', 'Prime = divisible only by 1 and itself.')); },
    () => { const n = pick([12, 18, 20, 24, 28, 30, 36, 40]); let c = 0; for (let i = 1; i <= n; i++) if (n % i === 0) c++; return Q(`🍪 You have ${n} cookies. How many different equal-row layouts work? (How many <strong>factors</strong> does ${n} have?)`, `Number of factors of ${n} = ?`, c, H(`Find pairs: 1 × ${n}, 2 × ${n / 2}, … Stop when the first number passes the second.`)); },
    () => { const n = pick([12, 16, 18, 20, 24, 28, 30]); const f = []; for (let i = 1; i <= n; i++) if (n % i === 0) f.push(i); return Q(`Write ALL the factors of <strong>${n}</strong>, separated by commas (any order).`, `Factors of ${n}`, f.join(','), H('Work in pairs: 1 × ?, 2 × ?, 3 × ? …', f.filter(i => i * i <= n).map(i => `${i}×${n / i}`).join(',  ')), { type: 'identify' }); },
    () => { const n = pick([12, 18, 20, 24, 30, 36, 45, 50, 60, 72]); const f = pf(n); return Q(`🌳 Build a factor tree. Write <strong>${n}</strong> as primes (repeat if needed), e.g. 2,2,3`, `${n} = ? × ? × …`, f.join(','), H('Divide by the smallest prime that fits (2, then 3, then 5…). Stop when every branch is prime.', `${n} = ${f.join(' × ')}`), { type: 'identify' }); },
    () => { const a = rnd(2, 4), b = rnd(1, 3); const n = 2 ** a * 3 ** b; return Q(`${n} = 2<sup>?</sup> × 3<sup>${b}</sup>. What is the missing power of 2?`, `${n} = 2<sup>?</sup> × 3<sup>${b}</sup>`, a, H(`Divide ${n} by 3 (${b} time${b > 1 ? 's' : ''}), then count how many 2s make what is left.`, `${n} ÷ ${3 ** b} = ${2 ** a} = 2<sup>${a}</sup>`)); },
    () => { const a = pick([[2, 3, 5], [2, 3, 7], [2, 5, 7], [3, 5, 7], [2, 2, 5], [2, 3, 3], [2, 2, 7]]); return Q('Multiply the prime ingredients to rebuild the number', a.join(' × ') + ' = ?', a.reduce((x, y) => x * y, 1), H('Multiply two at a time, left to right.')); },
    () => { const n = pick([29, 39, 51, 53, 57, 61, 87, 91, 97, 101]); const pr = pf(n).length === 1; return Q(`Is <strong>${n}</strong> a prime number? Type yes or no`, `${n}: prime?`, pr ? 'yes' : 'no', H('Test 2, 3, 5, 7. If any divides evenly, it is not prime.', pr ? `${n} has no factors except 1 and ${n} → prime` : `${n} = ${pf(n).join(' × ')} → not prime`)); },

const normalizeAnswer = s => String(s).trim().toLowerCase().replace(/\s+/g, '').replace(/−/g, '-');
function numericValue(s) { const c = s.replace(/[£$€,]/g, '').replace(/%$/, ''); if (c === '' || c === '-' || isNaN(c)) return null; const n = Number(c); return Number.isFinite(n) ? n : null; }
function answerMatches(userRaw, correctRaw, type) {
  const u = normalizeAnswer(userRaw), c = normalizeAnswer(correctRaw);
  if (type === 'identify') {
    const eq = (a, b) => a === b || (numericValue(a) !== null && numericValue(b) !== null && Math.abs(numericValue(a) - numericValue(b)) < 1e-9);
    const up = u.split(',').filter(Boolean).sort(), cp = c.split(',').filter(Boolean).sort();
    return up.length === cp.length && up.every((p, i) => eq(p, cp[i]));
  }
  const acc = c.split('|'); if (acc.includes(u)) return true;
  const un = numericValue(u); if (un !== null) return acc.some(a => { const an = numericValue(a); return an !== null && Math.abs(an - un) < 1e-9; });
  return false;
}

    <div class="card">
      <h2>🎁 Mystery Box</h2>
      <p>Pick a finished dish. 5 new questions, new numbers. Win up to ⭐⭐⭐ — stars stay forever.</p>
      <button class="btn ghost" onclick="openBoxPicker()">Open a box</button>
    </div>
    <div class="card">
      <h2>🔧 Fix the Recipe</h2>
      <p>${fx ? `${fx} dish${fx > 1 ? 'es' : ''} to polish. Fresh numbers, same skill. Fix them for bonus XP!` : 'No slip-ups to fix. Clean kitchen! 🎉'}</p>
      <button class="btn ghost" ${fx ? '' : 'disabled'} onclick="startFix()">Fix up to 5</button>
    </div>
    <div class="card">
      <h2>🥬 The Fridge</h2>
      <p>Skills that haven’t been tasted for the longest. Use them before they spoil!</p>
      <div class="fridge-list">${fridgeHtml}</div>
    </div>
    <a class="back-link" href="index.html">← Back to Kitchen Ninja HQ</a>`;
}

// ══════════════════════ QUIZ ENGINE ══════════════════════
let QZ = null;
function startQuiz(kind, title, items, onDone) { QZ = { kind, title, items, i: 0, correct: 0, hint: 0, answered: false, onDone }; show('quiz'); renderQ(); }
function quitQuiz() { if (confirm('Stop now? Your answers so far still count for the dishes you tasted.')) goHome(); }
function hintTiers(m) { const h = m.hint; if (!h) return []; if (typeof h === 'string') return [{ l: '💡 Hint', c: h }]; const t = []; if (h.setup) t.push({ l: '✏️ Set it up', c: h.setup }); if (h.formula) t.push({ l: '📐 Key idea', c: h.formula }); return t; }
function renderQ() {
  const it = QZ.items[QZ.i], m = it.mission; QZ.hint = 0; QZ.answered = false;
  $('qtitle').textContent = QZ.title; $('qcount').textContent = `${QZ.i + 1} / ${QZ.items.length}`; $('qbar').style.width = (QZ.i / QZ.items.length * 100) + '%';
  const vis = m.visual || (m.hint && typeof m.hint === 'object' && m.hint.visual) || '';
  const tiers = hintTiers(m);
  $('qwrap').innerHTML = `<div class="qcard">
    <div class="tag ${it.cls}">${it.tag}</div>
    <div class="ins">${m.instruction}</div>
    ${vis ? `<div class="vis">${vis}</div>` : ''}
    <div class="prob">${String(m.problem).replace(/\n/g, '<br>')}</div>
    <div class="row"><input class="inp" id="qin" type="text" placeholder="Your answer" inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false"><button class="chk" onclick="checkQ()">Check</button></div>
    <div class="fb" id="qfb"></div>
    ${tiers.length ? `<button class="hint-btn" id="qhint" onclick="showHint()">💡 Need a hint?</button>` : ''}
    <div class="hint-panel" id="qhp"></div>
    <div class="nav"><button class="btn green" id="qnext" onclick="nextQ()" disabled>${QZ.i === QZ.items.length - 1 ? 'Finish ✓' : 'Next →'}</button></div>
  </div>`;
  const inp = $('qin'); inp.addEventListener('keypress', e => { if (e.key === 'Enter') checkQ(); }); setTimeout(() => inp.focus(), 80);
}
function showHint() {
  const m = QZ.items[QZ.i].mission, t = hintTiers(m); if (QZ.hint < t.length) QZ.hint++;
  const p = $('qhp'); p.classList.add('open'); p.innerHTML = t.slice(0, QZ.hint).map(x => `<div class="hint-tier"><div class="hint-lab">${x.l}</div><div>${x.c}</div></div>`).join('');
  if (QZ.hint >= t.length) $('qhint').style.display = 'none'; else $('qhint').textContent = '💡 Show me more';
}
function checkQ() {
  if (QZ.answered) return; const it = QZ.items[QZ.i], m = it.mission, inp = $('qin');
  if (!inp.value.trim()) return;
  const ok = answerMatches(inp.value, m.answer, m.type); QZ.answered = true; inp.disabled = true; inp.classList.add(ok ? 'correct' : 'wrong');
  const fb = $('qfb'); fb.className = 'fb show ' + (ok ? 'correct' : 'wrong');
  fb.innerHTML = ok ? '<div>✅</div><div>Correct! Nice slice.</div>' : `<div>💡</div><div>Not quite — the answer is <strong>${String(m.answer).split('|')[0]}</strong>. That’s how we learn!</div>`;
  if (ok) QZ.correct++;
  DS.lastSeen[it.level] = Date.now();
  if (ok && QZ.kind === 'fix' && it.fixIdx != null) { const arr = DS.fixed[it.level] = DS.fixed[it.level] || []; if (!arr.includes(it.fixIdx)) arr.push(it.fixIdx); }
  saveDS(); $('qnext').disabled = false; $('qnext').focus && 0;
}
function nextQ() { QZ.i++; if (QZ.i >= QZ.items.length) finishQuiz(); else renderQ(); }
let toastTimer = null;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1400); }

// ══════════════════════ THE THREE MODES ══════════════════════
function startDaily() {
  const cur = currentLevel(), idx = shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]).slice(0, 3);
  const cands = fridgeList().filter(l => l !== cur).slice(0, 6); let fr = shuffle(cands).slice(0, 2);
  if (fr.length < 2) { const more = shuffle(S1_LEVELS.filter(l => !fr.includes(l) && l !== cur)).slice(0, 2 - fr.length); fr = fr.concat(more); }
  const mk = (l, i, tag, cls) => ({ level: l, mission: freshMission(l, i), tag, cls });
  const items = [mk(cur, idx[0], '🍳 Fresh dish · ' + meta(cur).title, 'new'), mk(fr[0], null, '🥬 From the Fridge · ' + meta(fr[0]).title, 'fridge'), mk(cur, idx[1], '🍳 Fresh dish · ' + meta(cur).title, 'new'), mk(fr[1], null, '🥬 From the Fridge · ' + meta(fr[1]).title, 'fridge'), mk(cur, idx[2], '🍳 Fresh dish · ' + meta(cur).title, 'new')];
  startQuiz('daily', 'Daily Special', items);
}
function openBoxPicker() {
  const list = [...S1_LEVELS, ...S2_LEVELS].filter(cooked);
  $('boxlist').innerHTML = list.length ? list.map(l => `<div class="pick-item" onclick="startBox(${l})"><div class="pick-num">${l}</div><div class="pick-title">${meta(l).emoji} ${meta(l).title}</div><div class="pick-stars">${starStr(starsOf(l))}</div></div>`).join('') : '<div class="card"><p>No finished dishes yet. Cook a level in the other apps first, then come back for stars!</p></div>';
  show('boxpick');
}
function startBox(l) {
  let items;
  if (l > 100) items = shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]).slice(0, 5).map(i => ({ level: l, mission: freshMission(l, i), tag: '🎁 Mystery Box', cls: 'box' }));
  else { const bank = GEN1[l]; items = Array.from({ length: 5 }, (_, k) => ({ level: l, mission: bank[k % bank.length](), tag: '🎁 Mystery Box', cls: 'box' })); }
  startQuiz('box:' + l, meta(l).title, items);
}
function startFix() {
  const w = shuffle(wrongList()).slice(0, 5); if (!w.length) return;
  startQuiz('fix', 'Fix the Recipe', w.map(x => ({ level: x.level, fixIdx: x.idx, mission: freshMission(x.level, x.idx), tag: '🔧 Fix · Level ' + x.level + ' ' + meta(x.level).title, cls: 'fix' })));
}
function finishQuiz() {
  const c = QZ.correct, n = QZ.items.length; let xp = 0, extra = '', emoji = '🍽️', head = 'Nicely done!';
  if (QZ.kind === 'daily') {
    xp = c * 20; const first = !dailyDoneToday();
    if (first) {
      xp += 30; const t = todayStr(); DS.streak = { count: (DS.streak.last === yesterdayStr() ? DS.streak.count : (DS.streak.last === t ? DS.streak.count : 0)) + 1, last: t };
      DS.daily = { date: t, done: true, correct: c, total: n };
      extra = `<div class="stamp">DONE TODAY</div><div class="big">🔥 Streak: <b>${DS.streak.count}</b> day${DS.streak.count > 1 ? 's' : ''}</div>`;
    }
    head = c >= 4 ? 'Chef’s kiss! 🤌' : c >= 2 ? 'Well seasoned!' : 'Every taste counts!'; emoji = '🍽️';
  } else if (QZ.kind.startsWith('box:')) {
    const l = Number(QZ.kind.slice(4)), earned = c >= 5 ? 3 : c === 4 ? 2 : c === 3 ? 1 : 0, had = starsOf(l);
    xp = c * 25; if (earned > had) { xp += 50 * (earned - had); DS.stars[l] = earned; extra = `<div class="big">New record! ${starStr(earned)}</div>`; }
    else extra = `<div class="big">Your best: ${starStr(had)}${had < 3 ? ' — try again for more!' : ' — perfect!'}</div>`;
    head = earned ? 'The box is open!' : 'Almost! Try another box'; emoji = '🎁';
  } else if (QZ.kind === 'fix') {
    xp = c * 20; extra = `<div class="big">${c} recipe${c === 1 ? '' : 's'} fixed 🔧</div>`; head = c ? 'Recipe repaired!' : 'Keep polishing'; emoji = '🔧';
  }
  DS.bonusXP += xp; saveDS();
  $('donebox').innerHTML = `<div class="emoji">${emoji}</div><h1>${head}</h1><div class="big"><b>${c} / ${n}</b> correct</div><div class="big">+<b>${xp}</b> bonus XP ✨</div>${extra}
    <div style="width:100%;max-width:320px;margin-top:10px"><button class="btn green" onclick="goHome()">🏠 Back to the kitchen</button></div>`;
  show('done');
}

loadAll(); renderHome(); syncOnLoad();
</script>
