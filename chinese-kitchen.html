<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chinese Kitchen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Bangers&display=swap');
  :root{
    --paper:#201410;
    --card:#32211a;
    --ink:#fbeee0;
    --ink-light:#c2a68a;
    --red:#e8482c;
    --red-dark:#c23b3b;
    --gold:#f4b400;
    --gold-dark:#d9a441;
    --green:#3E8E5C;
    --line:#5a3d26;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, #3a2412 0%, #201410 55%, #150d0a 100%);
    color:var(--ink);
    font-family:'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  #app{ max-width:640px; margin:0 auto; padding:18px 16px 60px; }
  h1,h2,h3{ margin:0 0 6px; }
  header.top{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  header.top .title{ font-family:'Bangers', cursive; font-size:24px; letter-spacing:1px; font-weight:400; color:var(--gold); }
  .back-btn{
    background:none; border:none; font-size:15px; color:var(--ink-light);
    cursor:pointer; padding:6px 4px 6px 0;
  }
  .back-btn:active{ color:var(--ink); }
  .subtitle{ color:var(--ink-light); font-size:13px; margin:-6px 0 16px; }

  .tile{
    background:var(--card); border:2px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:2px 2px 0 var(--line);
  }
  .tile .name{ font-weight:700; font-size:16px; }
  .tile .sub{ font-size:12.5px; color:var(--ink-light); margin-top:2px; }
  .tile .status{ font-size:12px; color:var(--green); font-weight:700; white-space:nowrap; }
  .tile .arrow{ font-size:18px; color:var(--ink-light); }
  .section-label{ font-size:13px; font-weight:800; color:var(--gold-dark); text-transform:uppercase; letter-spacing:0.5px; margin:20px 0 8px; }

  .card{
    background:var(--card); border:2px solid var(--ink); border-radius:var(--radius);
    padding:26px 20px; text-align:center; min-height:190px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    box-shadow:4px 4px 0 var(--gold);
  }
  .card .hanzi{ font-size:44px; font-weight:700; }
  .card .pinyin{ font-size:19px; color:var(--red-dark); font-weight:700; }
  .card .english{ font-size:17px; background:rgba(244,180,0,0.14); border:1px solid var(--line); border-radius:8px; padding:8px 14px; }
  .card .type{ font-size:11.5px; color:var(--ink-light); letter-spacing:0.5px; text-transform:uppercase; }
  .progress-line{ font-size:13px; color:var(--ink-light); margin-bottom:8px; }

  .btn{
    background:var(--red); color:#fff; border:none; border-radius:10px;
    padding:12px 18px; font-size:15px; font-weight:700; cursor:pointer;
    font-family:inherit;
  }
  .btn:active{ background:var(--red-dark); }
  .btn.secondary{ background:var(--card); color:var(--ink); border:2px solid var(--ink); }
  .btn:disabled{ opacity:.4; }
  .nav-row{ display:flex; gap:10px; margin-top:14px; justify-content:center; }

  .dialogue-line{
    background:var(--card); border:2px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px;
  }
  .dialogue-line .speaker{ font-size:12px; font-weight:800; color:var(--gold-dark); margin-bottom:4px; }
  .dialogue-line .hanzi{ font-size:20px; margin-bottom:4px; }
  .dialogue-line .pinyin{ font-size:14px; color:var(--red-dark); }
  .dialogue-line .english{ font-size:14px; color:var(--ink-light); margin-top:4px; }
  .dialogue-line.current{ border-color:var(--red); box-shadow:2px 2px 0 var(--gold); }
  .dialogue-line.dim{ opacity:.35; }

  .pattern-card{
    background:var(--card); border:2px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; cursor:pointer;
  }
  .pattern-card .head{ display:flex; justify-content:space-between; align-items:center; }
  .pattern-card .hanzi{ font-size:19px; font-weight:700; }
  .pattern-card .pinyin{ font-size:13px; color:var(--red-dark); }
  .pattern-card .meaning{ font-size:12.5px; color:var(--ink-light); }
  .pattern-card .examples{ margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; display:none; }
  .pattern-card.open .examples{ display:block; }
  .example-row{ margin-bottom:8px; }
  .example-row .hanzi{ font-size:16px; }
  .example-row .pinyin{ font-size:13px; color:var(--red-dark); }
  .example-row .english{ font-size:13px; color:var(--ink-light); }

  .match-grid{ display:flex; gap:14px; margin-top:14px; }
  .match-col{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .match-item{
    background:var(--card); border:2px solid var(--ink); border-radius:10px;
    padding:12px 10px; text-align:center; cursor:pointer; font-weight:700; font-size:14px;
  }
  .match-item.selected{ background:var(--gold); color:#2b1810; }
  .match-item.correct{ background:var(--green); color:#fff; border-color:var(--green); cursor:default; }
  .match-item.wrong{ background:var(--red); color:#fff; border-color:var(--red); }
  .match-item.done{ visibility:hidden; }
  .match-status{ text-align:center; font-size:14px; margin-top:14px; color:var(--ink-light); }

  .stroke-card{
    background:var(--card); border:2px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px;
  }
  .stroke-shape{ font-size:26px; width:44px; text-align:center; }
  .stroke-info{ flex:1; }
  .stroke-info .name{ font-weight:700; font-size:15px; }
  .stroke-info .name .en{ font-weight:400; color:var(--ink-light); font-size:13px; }
  .stroke-info .dir{ font-size:13px; color:var(--red-dark); margin:2px 0; }
  .stroke-info .examples{ font-size:20px; }
  .stroke-info .tip{ font-size:12px; color:var(--gold-dark); margin-top:4px; font-style:italic; }

  .active-banner{ background:rgba(244,180,0,0.14); border:2px solid var(--gold); border-radius:12px; padding:10px 14px; margin:0 0 14px; font-weight:800; color:var(--gold); font-size:14px; }
  .tipbox{ background:rgba(42,157,143,0.14); border:2px solid #2a9d8f; border-radius:12px; padding:12px 14px; margin:14px 0 6px; font-size:14px; line-height:1.5; }
  .tipbox b{ color:var(--gold); }
  .draftnote{ background:rgba(215,38,61,0.12); border:1px dashed var(--red); border-radius:10px; padding:8px 12px; font-size:12.5px; color:var(--ink-light); margin:6px 0 12px; }
  .examhead{ font-family:'Bangers',cursive; font-size:20px; letter-spacing:1px; color:var(--gold); margin:22px 0 2px; }
  details.sec{ background:var(--card); border:2px solid var(--line); border-radius:12px; margin:8px 0; padding:0; }
  details.sec > summary{ cursor:pointer; padding:12px 14px; font-weight:800; font-size:14px; color:var(--gold); list-style:none; }
  details.sec > summary::-webkit-details-marker{ display:none; }
  details.sec[open] > summary{ border-bottom:1px dashed var(--line); }
  details.sec .inner{ padding:10px 12px 4px; }
  details.sec .dialogue-line{ margin-bottom:8px; }
  .storybox{ font-size:13.5px; color:var(--ink-light); font-style:italic; margin:0 0 12px; line-height:1.45; }
  .wbbig{ font-size:30px; font-weight:800; letter-spacing:.5px; }
  .wbsm{ font-size:16px; color:var(--red-dark); font-weight:700; }
  .wbq{ font-size:19px; line-height:1.5; text-align:center; }
  .wbopts{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .wbopt{ background:var(--card); color:var(--ink); border:2px solid var(--ink); border-radius:12px; padding:16px 8px; font-size:18px; font-weight:800; font-family:inherit; cursor:pointer; }
  .wbopt:active{ background:var(--gold); color:#2b1810; }
  .wbopt.right{ background:var(--green); border-color:var(--green); color:#fff; }
  .wbopt.wrong{ background:var(--red); border-color:var(--red); color:#fff; }
  .wbopt:disabled:not(.right){ opacity:.45; }
  .wbfb{ margin-top:14px; text-align:center; }
  .wbgood{ background:rgba(62,142,92,.18); border:2px solid var(--green); border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:14.5px; }
  .empty-note{ color:var(--ink-light); font-size:14px; padding:10px 2px; }
</style>
</head>

function matchPairsFor(examId){
  const arr = MATCH_BY_EXAM[examId] || MATCH_PAIRS;
  if(arr.length <= 10) return arr;
  return arr.slice().sort(()=>Math.random()-0.5).slice(0,10);   // fresh round of 10 each time
}

/* ============ STATE / PERSISTENCE ============ */
const STORAGE_KEY = "chinese-kitchen-state";
function loadProgress(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveProgress(p){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch(e){}
}
let progress = loadProgress();
function lessonProgress(id){
  if(!progress[id]) progress[id] = {vocabDone:false, dialogueDone:false};
  return progress[id];
}
function markDone(id, field){
  const lp = lessonProgress(id);
  lp[field] = true;
  progress[id] = lp;
  saveProgress(progress);
}
function findLesson(id){ return LESSONS.find(l => l.id === id); }


/* ============ WORKBOOK LAB — practice built from the son's exercise book (Unit Two, p23–41) ============
   Question shape: {q, p?(hint), a(answer), o?(options), ex?(shown after a right answer)}.
   If o is missing the options are made automatically (see wbOptions). Stroke counts were checked against a stroke database
   (the 5 answers given in the workbook all matched). Picture questions are rebuilt as words. */
const WB_INITIALS = [['b','p','m','f'],['d','t','n','l'],['g','k','h'],['j','q','x'],['zh','ch','sh','r'],['z','c','s']];
function wbShuffle(a){ return a.slice().sort(()=>Math.random()-0.5); }
function wbOptions(q, pool){
  if(q.o) return wbShuffle(q.o);
  if(q.kind==='init'){
    const grp = WB_INITIALS.find(g=>g.includes(q.a)) || [];
    let wrong = grp.filter(x=>x!==q.a);
    const rest = wbShuffle(WB_INITIALS.flat().filter(x=>x!==q.a && !wrong.includes(x)));
    wrong = wbShuffle(wrong).concat(rest).slice(0,3);
    return wbShuffle([q.a].concat(wrong));
  }
  if(q.kind==='stroke'){
    const n=+q.a, c=[n-2,n-1,n+1,n+2].filter(x=>x>0);
    return wbShuffle([n].concat(wbShuffle(c).slice(0,3))).map(String);
  }
  if(pool){ return wbShuffle([q.a].concat(wbShuffle(pool.filter(x=>x!==q.a)).slice(0,3))); }
  return [q.a];
}
const wbI = (blank,a,full,eng)=>({kind:'init', q:`<span class="wbbig">${blank}</span>`, p:'Which starting sound (initial) completes the word?', a, ex:`${full}${eng?' — '+eng:''}`});
const wbS = (ch,py,n)=>({kind:'stroke', q:`<span class="wbbig">${ch}</span> <span class="wbsm">${py}</span>`, p:'How many strokes?', a:String(n), ex:`${ch} has ${n} strokes.`});
const wbT = (plain,a,wrong)=>({q:`<span class="wbbig">${plain}</span>`, p:'Which one has the right tones?', a, o:[a].concat(wrong), ex:`${a}`});
const wbD = (q,a,box,ex)=>({q, p:'Word box: '+box.join(' · '), a, o:box, ex:ex||''});

function wbDone(lessonId, idx){ const lp=lessonProgress(lessonId); lp.wb=lp.wb||{}; lp.wb[idx]=true; progress[lessonId]=lp; saveProgress(progress); }
function wbCount(lessonId){ const lp=lessonProgress(lessonId); const n=(WORKBOOK[lessonId]||[]).length; let d=0; for(let i=0;i<n;i++) if(lp.wb && lp.wb[i]) d++; return {d,n}; }

function renderWorkbook(lessonId){
  const lesson=findLesson(lessonId); const sets=WORKBOOK[lessonId]||[];
  topBar("\u{1F9EA} Workbook Lab", ()=>nav({screen:"lesson", lessonId}));
  const sub=document.createElement('p'); sub.className="subtitle";
  sub.textContent=`Lesson ${lesson.num} · practice made from your exercise book. Tap a set. Wrong answer? Just tap again!`; app.appendChild(sub);
  const lp=lessonProgress(lessonId);

    const t=document.createElement('div'); t.className="tile";
    t.innerHTML=`<div><div class="name">${s.title}</div><div class="sub">${s.sub} · ${s.qs.length} questions</div></div><span class="status">${done?'\u2713 Done':''}</span><span class="arrow">\u2192</span>`;
    t.onclick=()=>nav({screen:"wbset", lessonId, setIdx:i});

/* ---- one quiz set ---- */
function renderWbSet(lessonId, setIdx){
  const set=WORKBOOK[lessonId][setIdx];
  topBar(set.title, ()=>nav({screen:"workbook", lessonId}));
  let i=0, firstTry=0, missedThis=false;
  const wrap=document.createElement('div'); app.appendChild(wrap);
  function draw(){
    wrap.innerHTML="";
    if(i>=set.qs.length){
      wbDone(lessonId,setIdx);
      const pct=Math.round(100*firstTry/set.qs.length);
      const msg = pct===100 ? "\u{1F3C6} Perfect plate! Every one first try." : pct>=70 ? "\u{1F525} Tasty work! Re-taste the ones you missed later." : "\u{1F373} Good cooking practice. Do it again to polish it.";
      wrap.innerHTML=`<div class="card"><div class="wbbig">${firstTry} / ${set.qs.length}</div><div class="english">${msg}</div></div>`;
      const row=document.createElement('div'); row.className="nav-row";
      const again=document.createElement('button'); again.className="btn secondary"; again.textContent="\u21BB Again"; again.onclick=()=>{ i=0; firstTry=0; draw(); };
      const back=document.createElement('button'); back.className="btn"; back.textContent="Back to sets"; back.onclick=()=>nav({screen:"workbook", lessonId});
      row.appendChild(again); row.appendChild(back); wrap.appendChild(row); return;
    }
    const q=set.qs[i]; missedThis=false;
    const opts=wbOptions(q, q.pool);
    wrap.innerHTML=`<div class="progress-line">${i+1} / ${set.qs.length}</div>
      <div class="card" style="min-height:140px"><div class="wbq">${q.q}</div>${q.p?`<div class="type">${q.p}</div>`:''}</div>
      <div id="wbOpts" class="wbopts"></div><div id="wbFb" class="wbfb"></div>`;
    const box=wrap.querySelector('#wbOpts'), fb=wrap.querySelector('#wbFb');
    opts.forEach(o=>{
      const b=document.createElement('button'); b.className="wbopt"; b.innerHTML=o;
      b.onclick=()=>{
        if(b.classList.contains('right')) return;
        if(String(o)===String(q.a)){
          b.classList.add('right'); if(!missedThis) firstTry++;
          box.querySelectorAll('.wbopt').forEach(x=>x.disabled=true);
          fb.innerHTML=`<div class="wbgood">\u2705 ${q.ex||'Correct!'}</div>`;
          const nx=document.createElement('button'); nx.className="btn"; nx.textContent = i===set.qs.length-1 ? "Finish" : "Next \u2192"; nx.onclick=()=>{ i++; draw(); };
          fb.appendChild(nx);
        } else { missedThis=true; b.classList.add('wrong'); setTimeout(()=>b.classList.remove('wrong'),500); }
      };
      box.appendChild(b);
    });
  }
  draw();
}

function termLabel(g){ return 'Year '+g.year+' · Term '+g.term; }
function renderHome(){
  topBar("\u{1F95F} Chinese Kitchen");

  const act = activeExam();

  ban.textContent="\u{1F4CC} Studying for: "+act.label; app.appendChild(ban);

  const groups = [];

  });

  curExams.forEach(e=>examSection(e, e.id===act.id));

/* ---- VOCAB FLASHCARDS ---- */
function renderVocab(lessonId){
  const lesson = findLesson(lessonId);
  topBar("\u{1F9C2} Ingredient Cards", ()=>nav({screen:"lesson", lessonId}));

  let idx = 0;
  let revealed = false;
  const cards = lesson.vocab;

  function draw(){
    const old = document.getElementById('vWrap');
    if(old) old.remove();
    const wrap = document.createElement('div');
    wrap.id = "vWrap";
    const c = cards[idx];
    wrap.innerHTML = `
      <div class="progress-line">${idx+1} / ${cards.length}</div>
      <div class="card">
        ${c.type? `<div class="type">${c.type}</div>` : ``}
        <div class="hanzi">${c.hanzi}</div>
        <div class="pinyin">${c.pinyin}</div>
        ${revealed? `<div class="english">${c.english}</div>` : `<button class="btn" id="vReveal">\u{1F944} Taste it (reveal meaning)</button>`}
      </div>
      <div class="nav-row">
        <button class="btn secondary" id="vPrev" ${idx===0?'disabled':''}>\u2190 Prev</button>
        <button class="btn" id="vNext">${idx===cards.length-1? 'Finish' : 'Next \u2192'}</button>
      </div>
    `;
    app.appendChild(wrap);
    if(!revealed){
      document.getElementById('vReveal').onclick = ()=>{ revealed=true; draw(); };
    }
    document.getElementById('vPrev').onclick = ()=>{ if(idx>0){ idx--; revealed=false; draw(); } };
    document.getElementById('vNext').onclick = ()=>{
      if(idx < cards.length-1){ idx++; revealed=false; draw(); }
      else { markDone(lessonId, 'vocabDone'); nav({screen:"lesson", lessonId}); }
    };
  }
  draw();
}

/* ---- DIALOGUE PRACTICE ---- */
function renderDialogue(lessonId){
  const lesson = findLesson(lessonId);
  topBar("\u{1F35C} Follow the Recipe", ()=>nav({screen:"lesson", lessonId}));

  let idx = 0;
  let stage = 0; // 0 = hanzi only, 1 = + pinyin, 2 = + english
  const lines = lesson.dialogue;

  function draw(){
    const old = document.getElementById('dWrap');
    if(old) old.remove();
    const wrap = document.createElement('div');
    wrap.id = "dWrap";
    const p = document.createElement('div');
    p.className = "progress-line";
    p.textContent = `${idx+1} / ${lines.length}`;
    wrap.appendChild(p);

    lines.forEach((line, i)=>{
      const row = document.createElement('div');
      row.className = "dialogue-line" + (i===idx? " current" : " dim");
      let inner = `<div class="speaker">${line.speaker}</div><div class="hanzi">${line.hanzi}</div>`;
      if(i===idx){
        if(stage>=1) inner += `<div class="pinyin">${line.pinyin}</div>`;
        if(stage>=2) inner += `<div class="english">${line.english}</div>`;
      }
      row.innerHTML = inner;
      wrap.appendChild(row);
    });

    const navRow = document.createElement('div');
    navRow.className = "nav-row";
    if(stage < 2){
      const btn = document.createElement('button');
      btn.className = "btn";
      btn.textContent = stage===0? "Show pinyin" : "Show English";
      btn.onclick = ()=>{ stage++; draw(); };
      navRow.appendChild(btn);
    } else {
      const btn = document.createElement('button');
      btn.className = "btn";
      btn.textContent = idx===lines.length-1? "Finish" : "Next step \u2192";
      btn.onclick = ()=>{
        if(idx < lines.length-1){ idx++; stage=0; draw(); }
        else { markDone(lessonId, 'dialogueDone'); nav({screen:"lesson", lessonId}); }
      };
      navRow.appendChild(btn);
    }
    wrap.appendChild(navRow);
    app.appendChild(wrap);
  }
  draw();
}

/* ---- PINYIN MATCH GAME ---- */
function renderMatch(){
  const PAIRS = matchPairsFor(route.examId);
  topBar("\u{1F525} Flavor Pairing", ()=>nav({screen:"home"}));
  const sub = document.createElement('p');
  sub.className = "subtitle";
  sub.textContent = "Tap a pinyin ingredient, then match it to its English flavor";
  app.appendChild(sub);

  const pinyinOrder = PAIRS.map((p,i)=>i).sort(()=>Math.random()-0.5);
  const englishOrder = PAIRS.map((p,i)=>i).sort(()=>Math.random()-0.5);
  let selectedPinyin = null;
  let matchedCount = 0;

  const grid = document.createElement('div');
  grid.className = "match-grid";
  const colA = document.createElement('div');
  colA.className = "match-col";
  const colB = document.createElement('div');
  colB.className = "match-col";
  grid.appendChild(colA);
  grid.appendChild(colB);
  app.appendChild(grid);

  const status = document.createElement('div');
  status.className = "match-status";
  status.textContent = `Matched: 0 / ${PAIRS.length}`;
  app.appendChild(status);

  pinyinOrder.forEach(i=>{
    const item = document.createElement('div');
    item.className = "match-item";
    item.textContent = PAIRS[i].pinyin;
    item.dataset.index = i;
    item.onclick = ()=>{
      if(item.classList.contains('correct')) return;
      colA.querySelectorAll('.match-item').forEach(el=>el.classList.remove('selected'));
      item.classList.add('selected');
      selectedPinyin = i;
    };
    colA.appendChild(item);
  });

  englishOrder.forEach(i=>{
    const item = document.createElement('div');
    item.className = "match-item";
    item.textContent = PAIRS[i].english;
    item.dataset.index = i;
    item.onclick = ()=>{
      if(item.classList.contains('correct') || selectedPinyin===null) return;
      const pinyinEl = colA.querySelector(`.match-item[data-index="${selectedPinyin}"]`);
      if(selectedPinyin === i){
        item.classList.remove('wrong');
        item.classList.add('correct');
        pinyinEl.classList.remove('selected');
        pinyinEl.classList.add('correct');
        selectedPinyin = null;
        matchedCount++;
        status.textContent = `Matched: ${matchedCount} / ${PAIRS.length}`;
        if(matchedCount === PAIRS.length){
          status.textContent = "\u{1F389} All matched! Nice work.";
        }
      } else {
        item.classList.add('wrong');
        setTimeout(()=>item.classList.remove('wrong'), 500);
      }
    };
    colB.appendChild(item);
  });
}

/* ---- STROKE ORDER GUIDE ---- */
function renderStrokes(){
  topBar("\u{1F52A} Knife & Wok Skills", ()=>nav({screen:"home"}));
  const sub = document.createElement('p');
  sub.className = "subtitle";
  sub.textContent = "The 10 basic strokes \u2014 with a kitchen memory trick for each (test on the real direction!)";
  app.appendChild(sub);

  STROKES.forEach(s=>{
    const card = document.createElement('div');
    card.className = "stroke-card";
    card.innerHTML = `
      <div class="stroke-shape">${s.shape}</div>
      <div class="stroke-info">
        <div class="name">${s.namePinyin} <span class="en">${s.nameEnglish}</span></div>
        <div class="dir">${s.dir}</div>
        <div class="examples">${s.examples}</div>
        <div class="tip">\u{1F373} ${s.kitchenTip}</div>
      </div>
    `;
    app.appendChild(card);
  });

  const lab=document.createElement('div'); lab.className="section-label"; lab.textContent="\u270D\uFE0F Writing-order rules (from the book, Lessons 7\u20138)"; app.appendChild(lab);
  STROKE_RULES.forEach(r=>{
    const row=document.createElement('div'); row.className="dialogue-line";
    row.innerHTML=`<div class="hanzi">${r.examples}</div><div class="pinyin">${r.rule}</div><div class="english">${r.kitchen}</div>`;
    app.appendChild(row);
  });
}
